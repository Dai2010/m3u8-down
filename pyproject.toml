[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m3u8-downloader"
version = "5.0.3"
description = "M3U8 downloader, ad filter, and local streaming proxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
desktop = ["PyQt6>=6.6.0"]

[project.scripts]
m3u8-downloader = "m3u8_downloader.main:main"
m3u8-downloader-gui = "m3u8_downloader.gui.app:main"
m3u8-downloader-tui = "m3u8_downloader.tui.app:main"

[tool.setuptools.packages.find]
include = ["m3u8_downloader*"]
