name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests
      - name: Compile Python sources
        run: python -m compileall -q m3u8_downloader tests

  linux-android:
    needs: python-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick dpkg-dev
      - name: Build Android APK
        working-directory: android
        env:
          CI_MAVEN_REPOS: official
        run: |
          log_file="$RUNNER_TEMP/android-gradle.log"
          set +e
          gradle :app:assembleDebug -PtargetAbi=arm64-v8a --no-daemon --max-workers=1 --stacktrace > "$log_file" 2>&1
          status=$?
          cat "$log_file"
          if [ "$status" -ne 0 ]; then
            details="$(grep -E '(Bilibili(StreamResolver|FallbackDataSource|CookieStore)|RequestHeaders)\.kt' "$log_file" | paste -sd ' ' -)"
            if [ -z "$details" ]; then
              details="$(grep -E '(^e: |^FAILURE:|^\* What went wrong:|^Execution failed|^> Task)' "$log_file" | tail -n 30 | paste -sd ' ' -)"
            fi
            if [ -z "$details" ]; then
              details="$(tail -n 20 "$log_file" | paste -sd ' ' -)"
            fi
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error file=android/app/build.gradle.kts,line=1,title=Android Gradle failure::$details"
            exit "$status"
          fi
      - name: Build Linux deb
        run: |
          deb_version="0.0.0+${GITHUB_SHA::12}"
          bash packaging/linux/build_deb.sh "$deb_version"
      - name: Build Termux aarch64 deb
        run: |
          deb_version="0.0.0+${GITHUB_SHA::12}"
          TERMUX_DEB_ARCHITECTURE=aarch64 bash packaging/termux/build_deb.sh "$deb_version"
      - name: Collect Linux, Termux and Android artifacts
        run: |
          deb_version="0.0.0+${GITHUB_SHA::12}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/m3u8-downloader-android-arm64-v8a-debug.apk
          cp "build/release/m3u8-downloader_${deb_version}_amd64.deb" dist/
          cp "build/release/m3u8-downloader_${deb_version}_termux_aarch64.deb" dist/
          sha256sum dist/* > dist/SHA256SUMS-linux-android.txt
      - name: Upload Linux, Termux and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-artifacts
          path: dist/*
          if-no-files-found: error

  windows:
    needs: python-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller pillow
      - name: Download VLC runtime
        shell: pwsh
        run: |
          $version = "3.0.21"
          $archive = Join-Path $env:RUNNER_TEMP "vlc-$version-win64.zip"
          $url = "https://get.videolan.org/vlc/$version/win64/vlc-$version-win64.zip"
          curl.exe -L --fail --retry 3 --retry-delay 2 --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw "VLC download failed with exit code $LASTEXITCODE" }
          tar.exe -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "VLC archive extraction failed with exit code $LASTEXITCODE" }
          $directory = Get-ChildItem $env:RUNNER_TEMP -Filter "libvlc.dll" -Recurse -File | Select-Object -First 1 | ForEach-Object { $_.Directory }
          if (-not $directory) { throw "VLC archive directory was not found" }
          "VLC_DIR=$($directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare icon
        shell: python
        run: |
          from PIL import Image

          source = Image.open("packaging/assets/m3u8-downloader.png").convert("RGBA")
          canvas_size = max(source.size)
          icon = Image.new("RGBA", (canvas_size, canvas_size), (0, 0, 0, 0))
          icon.paste(source, ((canvas_size - source.width) // 2, (canvas_size - source.height) // 2))
          icon.save("packaging/assets/m3u8-downloader.ico", format="ICO", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
      - name: Build GUI executable
        run: pyinstaller --name m3u8-downloader-gui --onefile --windowed --paths . --collect-submodules m3u8_downloader --hidden-import vlc --icon packaging/assets/m3u8-downloader.ico --add-data "packaging/assets/m3u8-downloader.ico;." --add-binary "$env:VLC_DIR/libvlc.dll;vlc" --add-binary "$env:VLC_DIR/libvlccore.dll;vlc" --add-data "$env:VLC_DIR/plugins;vlc/plugins" m3u8_downloader/gui/launcher.py
      - name: Build CLI executable
        run: pyinstaller --name m3u8-downloader --onefile --console --paths . --collect-submodules m3u8_downloader --collect-submodules textual --hidden-import m3u8_downloader.tui.app --icon packaging/assets/m3u8-downloader.ico m3u8_downloader/cli_launcher.py
      - name: Build TUI executable
        run: pyinstaller --name m3u8-downloader-tui --onefile --console --paths . --collect-submodules m3u8_downloader --collect-submodules textual --hidden-import m3u8_downloader.tui.app --icon packaging/assets/m3u8-downloader.ico m3u8_downloader/tui/launcher.py
      - name: Install Windows installer tools
        run: choco install wixtoolset innosetup --no-progress -y
      - name: Prepare release metadata and license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path

          def escape_rtf(text: str) -> str:
              output = []
              for char in text:
                  codepoint = ord(char)
                  if char in "\\{}":
                      output.append("\\" + char)
                  elif char == "\n":
                      output.append("\\par\n")
                  elif char == "\r":
                      continue
                  elif codepoint > 127:
                      output.append(f"\\u{codepoint}?")
                  else:
                      output.append(char)
              return "".join(output)

          license_text = Path("LICENSE").read_text(encoding="utf-8")
          rtf = "{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Courier New;}}\\f0\\fs16\n" + escape_rtf(license_text) + "\n}"
          Path("dist/GPL-3.0.rtf").write_text(rtf, encoding="ascii")
          PY
          echo "ASSET_VERSION=ci-${GITHUB_SHA::12}" >> "$GITHUB_ENV"
          echo "APP_VERSION=0.0.0" >> "$GITHUB_ENV"
      - name: Build exe installer
        shell: cmd
        run: |
          iscc "/DAppVersion=%APP_VERSION%" "/DDisplayVersion=%ASSET_VERSION%" "/DAssetVersion=%ASSET_VERSION%" "/DSourceDir=%CD%\dist" "/DOutputDir=%CD%\dist" "/DIconFile=%CD%\packaging\assets\m3u8-downloader.ico" "/DLicenseFile=%CD%\LICENSE" packaging\windows\m3u8-downloader.iss
      - name: Build msi
        shell: cmd
        run: |
          candle -dAppVersion=%APP_VERSION% -dSourceGuiExe=dist\m3u8-downloader-gui.exe -dSourceCliExe=dist\m3u8-downloader.exe -dSourceTuiExe=dist\m3u8-downloader-tui.exe -dIconFile=packaging\assets\m3u8-downloader.ico -dLicenseRtf=dist\GPL-3.0.rtf packaging\windows\m3u8-downloader.wxs -out dist\m3u8-downloader.wixobj
          light -ext WixUIExtension -out dist\m3u8-downloader-%ASSET_VERSION%-windows-x64.msi dist\m3u8-downloader.wixobj
      - name: Collect Windows artifacts
        shell: bash
        run: |
          sha256sum "dist/m3u8-downloader-${ASSET_VERSION}-windows-x64.exe" "dist/m3u8-downloader-${ASSET_VERSION}-windows-x64.msi" > dist/SHA256SUMS-windows.txt
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/m3u8-downloader-*-windows-x64.exe
            dist/m3u8-downloader-*-windows-x64.msi
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
