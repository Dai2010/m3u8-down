name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v4.2.0
        required: true
        default: v4.2.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests

  linux-android:
    if: ${{ contains(github.event.inputs.tag || github.ref_name, 'windows-fix') == false }}
    needs: python-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick dpkg-dev
      - name: Build Android APK
        working-directory: android
        env:
          CI_MAVEN_REPOS: official
        run: gradle :app:assembleDebug -PtargetAbi=arm64-v8a --no-daemon --max-workers=1
      - name: Build deb
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          bash packaging/linux/build_deb.sh "$version"
      - name: Collect assets
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/m3u8-downloader-android-arm64-v8a-debug.apk
          cp "build/release/m3u8-downloader_${version}_amd64.deb" dist/
          sha256sum dist/* > dist/SHA256SUMS-linux-android.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes/${{ github.event.inputs.tag || github.ref_name }}.md
          files: dist/*

  windows:
    needs: python-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller pillow
      - name: Prepare release metadata and license
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          asset_version="${tag#v}"
          app_version="${asset_version%%-*}"
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path

          def escape_rtf(text: str) -> str:
              output = []
              for char in text:
                  codepoint = ord(char)
                  if char in "\\{}":
                      output.append("\\" + char)
                  elif char == "\n":
                      output.append("\\par\n")
                  elif char == "\r":
                      continue
                  elif codepoint > 127:
                      output.append(f"\\u{codepoint}?")
                  else:
                      output.append(char)
              return "".join(output)

          license_text = Path("LICENSE").read_text(encoding="utf-8")
          rtf = "{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Courier New;}}\\f0\\fs16\n" + escape_rtf(license_text) + "\n}"
          Path("dist/GPL-3.0.rtf").write_text(rtf, encoding="ascii")
          PY
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=$asset_version" >> "$GITHUB_ENV"
          echo "APP_VERSION=$app_version" >> "$GITHUB_ENV"
      - name: Prepare icon
        shell: python
        run: |
          from PIL import Image

          source = Image.open("packaging/assets/m3u8-downloader.png").convert("RGBA")
          canvas_size = max(source.size)
          icon = Image.new("RGBA", (canvas_size, canvas_size), (0, 0, 0, 0))
          icon.paste(source, ((canvas_size - source.width) // 2, (canvas_size - source.height) // 2))
          icon.save("packaging/assets/m3u8-downloader.ico", format="ICO", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
      - name: Build GUI executable
        run: pyinstaller --name m3u8-downloader-gui --onefile --windowed --paths . --collect-submodules m3u8_downloader --icon packaging/assets/m3u8-downloader.ico --add-data "packaging/assets/m3u8-downloader.ico;." m3u8_downloader/gui/launcher.py
      - name: Build CLI executable
        run: pyinstaller --name m3u8-downloader --onefile --console --paths . --collect-submodules m3u8_downloader --collect-submodules textual --hidden-import m3u8_downloader.tui.app --icon packaging/assets/m3u8-downloader.ico m3u8_downloader/cli_launcher.py
      - name: Build TUI executable
        run: pyinstaller --name m3u8-downloader-tui --onefile --console --paths . --collect-submodules m3u8_downloader --collect-submodules textual --icon packaging/assets/m3u8-downloader.ico m3u8_downloader/tui/launcher.py
      - name: Install Windows installer tools
        run: choco install wixtoolset innosetup --no-progress -y
      - name: Build exe installer
        shell: cmd
        run: |
          iscc "/DAppVersion=%APP_VERSION%" "/DDisplayVersion=%ASSET_VERSION%" "/DAssetVersion=%ASSET_VERSION%" "/DSourceDir=%CD%\dist" "/DOutputDir=%CD%\dist" "/DIconFile=%CD%\packaging\assets\m3u8-downloader.ico" "/DLicenseFile=%CD%\LICENSE" packaging\windows\m3u8-downloader.iss
      - name: Build msi
        shell: cmd
        run: |
          candle -dAppVersion=%APP_VERSION% -dSourceGuiExe=dist\m3u8-downloader-gui.exe -dSourceCliExe=dist\m3u8-downloader.exe -dSourceTuiExe=dist\m3u8-downloader-tui.exe -dIconFile=packaging\assets\m3u8-downloader.ico -dLicenseRtf=dist\GPL-3.0.rtf packaging\windows\m3u8-downloader.wxs -out dist\m3u8-downloader.wixobj
          light -ext WixUIExtension -out dist\m3u8-downloader-%ASSET_VERSION%-windows-x64.msi dist\m3u8-downloader.wixobj
      - name: Collect assets
        shell: bash
        run: |
          sha256sum "dist/m3u8-downloader-${ASSET_VERSION}-windows-x64.exe" "dist/m3u8-downloader-${ASSET_VERSION}-windows-x64.msi" > dist/SHA256SUMS-windows.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes/${{ github.event.inputs.tag || github.ref_name }}.md
          files: |
            dist/m3u8-downloader-*-windows-x64.exe
            dist/m3u8-downloader-*-windows-x64.msi
            dist/SHA256SUMS-windows.txt
