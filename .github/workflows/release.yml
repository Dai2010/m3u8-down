name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v4.0.1
        required: true
        default: v4.0.1
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  python-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests

  linux-android:
    needs: python-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick dpkg-dev
      - name: Build Android APK
        working-directory: android
        env:
          CI_MAVEN_REPOS: official
        run: gradle :app:assembleDebug -PtargetAbi=arm64-v8a --no-daemon --max-workers=1
      - name: Build deb
        run: bash packaging/linux/build_deb.sh 4.0.1
      - name: Collect assets
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/m3u8-downloader-android-arm64-v8a-debug.apk
          cp build/release/m3u8-downloader_4.0.1_amd64.deb dist/
          sha256sum dist/* > dist/SHA256SUMS-linux-android.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes/${{ github.event.inputs.tag || github.ref_name }}.md
          files: dist/*

  windows:
    needs: python-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller pillow
      - name: Prepare icon
        shell: python
        run: |
          from PIL import Image
          image = Image.open("packaging/assets/m3u8-downloader.png")
          image.save("packaging/assets/m3u8-downloader.ico", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
      - name: Build GUI executable
        run: pyinstaller --name m3u8-downloader-gui --onefile --windowed --paths . --collect-submodules m3u8_downloader --icon packaging/assets/m3u8-downloader.ico --add-data "packaging/assets/m3u8-downloader.ico;." m3u8_downloader/gui/launcher.py
      - name: Build CLI executable
        run: pyinstaller --name m3u8-downloader --onefile --console --paths . --collect-submodules m3u8_downloader --collect-submodules textual --hidden-import m3u8_downloader.tui.app m3u8_downloader/cli_launcher.py
      - name: Build TUI executable
        run: pyinstaller --name m3u8-downloader-tui --onefile --console --paths . --collect-submodules m3u8_downloader --collect-submodules textual m3u8_downloader/tui/launcher.py
      - name: Install Windows installer tools
        run: choco install wixtoolset innosetup --no-progress -y
      - name: Build exe installer
        shell: cmd
        run: |
          iscc "/DAppVersion=4.0.1" "/DSourceDir=%CD%\dist" "/DOutputDir=%CD%\dist" "/DIconFile=%CD%\packaging\assets\m3u8-downloader.ico" packaging\windows\m3u8-downloader.iss
      - name: Build msi
        shell: cmd
        run: |
          candle -dSourceGuiExe=dist\m3u8-downloader-gui.exe -dSourceCliExe=dist\m3u8-downloader.exe -dSourceTuiExe=dist\m3u8-downloader-tui.exe -dIconFile=packaging\assets\m3u8-downloader.ico packaging\windows\m3u8-downloader.wxs -out dist\m3u8-downloader.wixobj
          light -ext WixUIExtension -out dist\m3u8-downloader-4.0.1-windows-x64.msi dist\m3u8-downloader.wixobj
      - name: Collect assets
        shell: bash
        run: |
          sha256sum dist/m3u8-downloader-4.0.1-windows-x64.exe dist/m3u8-downloader-4.0.1-windows-x64.msi > dist/SHA256SUMS-windows.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes/${{ github.event.inputs.tag || github.ref_name }}.md
          files: |
            dist/m3u8-downloader-4.0.1-windows-x64.exe
            dist/m3u8-downloader-4.0.1-windows-x64.msi
            dist/SHA256SUMS-windows.txt
